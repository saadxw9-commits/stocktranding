# صناديق الدول وأسواقها الأصلية لملخص ما قبل الافتتاح (skills/premarket-gap-brief).
# fx_quote: per_usd = عدد وحدات العملة المحلية مقابل الدولار (USDBRL)، usd_per = دولار مقابل الوحدة (EURUSD).
# beta: حساسية الصندوق لمؤشر السوق المحلي بعد التحويل بالدولار. 1.0 قيمة مبدئية تُعاير من السجل.
# رموز TradingView للاسترشاد؛ تحقّق منها في tradingview-mcp قبل الاعتماد عليها.

thresholds:
  watch_pct: 1.5        # فجوة متوقعة تستحق المتابعة
  large_pct: 3.0        # فجوة كبيرة
  no_chase_minutes: 15  # لا شراء عقود في اتجاه الفجوة قبل مرور هذه المدة بعد الافتتاح

