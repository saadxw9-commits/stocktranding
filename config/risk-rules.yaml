# قواعد المخاطرة — يعدّلها المالك فقط. القيم الحالية افتراضية متحفظة لرأس مال ١٠٠٠ دولار.
capital_usd: 1000
cash_buffer_pct: 20            # نسبة نقد لا تُستثمر
max_position_pct: 25           # أقصى وزن لسهم واحد
max_positions: 5               # أقصى عدد مراكز مفتوحة
max_loss_per_trade_pct: 2      # أقصى خسارة للصفقة من رأس المال (٢٠ دولارًا)
max_weekly_loss_pct: 6         # يتوقف الاقتراح بقية الأسبوع إذا تجاوزه
min_reward_risk: 2.0           # أقل نسبة عائد إلى مخاطرة
min_confidence_to_suggest: 65  # لا يُعرض اقتراح دخول أقل من هذه الثقة
min_avg_dollar_volume: 5000000 # حد السيولة: متوسط قيمة التداول اليومي بالدولار
min_price_usd: 1               # لا حد أعلى للسعر
require_stop: true
allow_short: false
allow_margin: false
allow_options: true             # فعّلها المالك في 28 نوفمبر 2026 (شراء Call/Put فقط، بلا بيع مكشوف)

execution:
  enabled: false               # لا يُفعَّل إلا بقرار مكتوب من المالك
  mode: paper                  # عند التفعيل لاحقًا: paper أولًا ثم live

# فلاتر جودة خاصة بمقارنة عقود الخيارات، قابلة للضبط.
max_quote_age_seconds: 60
max_option_spread_pct: 5
# ميزانية عقد الخيار: علاوة العقد هي أقصى خسارة. لا تُطبَّق عليها حدود الأسهم
# (2% للصفقة و25% للمركز و20% احتياطي). السقف هنا نسبة من رأس المال، مع النقد المتاح وميزانيتك في كل تشغيل.
options_max_premium_pct: 100
